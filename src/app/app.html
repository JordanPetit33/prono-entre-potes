<header>
  <h1>{{ title }}</h1>
  @if (hasPlayers() && !corrupted()) {
    <app-player-picker />
  }
</header>
<app-storage-banner />
@if (unexpectedError(); as message) {
  <div class="unexpected-error" role="alert" data-testid="unexpected-error">
    <p>{{ message }}</p>
    <button type="button" aria-label="Fermer le message" (click)="dismissError()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </div>
}
@if (corrupted()) {
  <main>
    <app-storage-error-screen />
  </main>
} @else {
  <main>
    <router-outlet />
  </main>
  <app-bottom-nav />
}
