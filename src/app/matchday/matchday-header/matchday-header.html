<section class="header">
  <div class="row">
    <h2>Journée {{ matchday() }}</h2>
    <div class="arrows">
      <button
        type="button"
        aria-label="Journée précédente"
        [disabled]="previous() === null"
        (click)="go(previous())"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <button
        type="button"
        aria-label="Journée suivante"
        [disabled]="next() === null"
        (click)="go(next())"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>
  </div>

  @if (progress(); as p) {
    <div class="progress">
      <div class="progress-label">
        <span>Tes pronos</span>
        <span class="count" data-testid="progress-count">{{ p.done }} / {{ p.total }}</span>
      </div>
      <div
        class="track"
        role="progressbar"
        aria-label="Pronostics saisis"
        aria-valuemin="0"
        [attr.aria-valuemax]="p.total"
        [attr.aria-valuenow]="p.done"
      >
        <div class="fill" [style.width.%]="percent()"></div>
      </div>
    </div>
  }
</section>
