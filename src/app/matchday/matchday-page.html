@if (hasPlayers()) {
  <app-matchday-header
    [matchday]="matchday()"
    [previous]="previous()"
    [next]="next()"
    [progress]="progress()"
    [standing]="standing()"
    (navigate)="goTo($event)"
  />

  @if (matches().length > 0) {
    <div class="cards">
      @for (match of matches(); track match.id) {
        <app-match-card
          [match]="match"
          [prediction]="predictions().get(match.id) ?? null"
          [result]="results().get(match.id) ?? null"
          [now]="now()"
        />
      }
    </div>
  } @else {
    <section class="panel">
      <p>Aucun match pour cette journée.</p>
      <a class="button" [routerLink]="['/resultats', matchday()]">Ajouter des matchs</a>
    </section>
  }
} @else {
  <section class="panel welcome">
    <h2>Bienvenue</h2>
    <p>Pour commencer, ajoutez les amis qui vont pronostiquer.</p>
    <a class="button" routerLink="/joueurs">Créer les joueurs</a>
  </section>
}
