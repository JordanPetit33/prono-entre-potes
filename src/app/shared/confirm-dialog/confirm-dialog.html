<dialog #dialog [attr.aria-labelledby]="messageId" (cancel)="onCancel($event)">
  <p [id]="messageId">{{ message() }}</p>
  <div class="actions">
    <button type="button" class="secondary" (click)="cancelled.emit()">Annuler</button>
    <button type="button" class="danger" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
  </div>
</dialog>
